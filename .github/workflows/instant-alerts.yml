# Premium "instant" alerts: every hour, ask the live site to send alerts for updates that went live since the
# last run, to premium accounts that chose instant alerts. Vercel's free plan runs its own scheduled jobs only
# once a day, so this hourly call comes from GitHub instead.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CRON_SECRET  the same value as the Vercel environment variable
#   SITE_URL     e.g. https://www.creativein.co.il
# Without them the job does nothing. The site answers "premium_off" while premium is switched off.
name: Instant alerts
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send instant alerts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then echo "secrets not set, skipping"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/alerts?only=instant"
